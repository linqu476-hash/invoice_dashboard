{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Invoice Dashboard{% endblock %}</title>
<link rel="stylesheet" href="{% static 'dashboard/style.css' %}"></head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">Trax Apparel<small>Invoice clearance</small></div>
  <nav>
    <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'job' %}on{% endif %}">Dashboard</a>
    <a href="{% url 'master_tool' %}" class="{% if request.resolver_match.url_name == 'master_tool' %}on{% endif %}">Packing plan → Master</a>
    <a href="{% url 'consignees' %}" class="{% if 'consignee' in request.resolver_match.url_name %}on{% endif %}">Consignees</a>
  </nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body></html>
