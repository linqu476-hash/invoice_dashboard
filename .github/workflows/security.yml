name: security
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"          # weekly: new vulnerabilities appear in dependencies that did not change
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history so the secret scan also reads old commits
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pip-audit bandit
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan of the code
        run: bandit -r app_core views invoicing scripts -ll -q
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
